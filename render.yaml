services:
  - type: web
    name: laswo-studios
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn laswo_studios.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: laswo-studios-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.12.4

databases:
  - name: laswo-studios-db
    plan: free
